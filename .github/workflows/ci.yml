name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only the main branch writes to the remote cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Static analysis (detekt)
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      # Screenshot tests run inside this task: Roborazzi renders through Robolectric, so no
      # emulator is needed. A UI change that was not intended fails here.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest test --continue

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: readana-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
            build/reports/detekt/**
          retention-days: 7

      # What the screen looks like now next to what it looked like before, so a failed screenshot
      # test can be judged from the diff rather than by rerunning it locally.
      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: |
            **/build/outputs/roborazzi/**
          retention-days: 7
          if-no-files-found: ignore
