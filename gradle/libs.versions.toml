# Central dependency catalog. Versions verified against Maven Central / Google Maven on 2026-08-20.
# Dependabot keeps this file current (see .github/dependabot.yml).

[versions]
# --- Build tooling ---
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
detekt = "2.0.0-alpha.6" # Built against Kotlin 2.4.10 / AGP 9.3.1 / Gradle 9.x; 1.23.x predates Gradle 9.
spotless = "8.10.4"
ktlint = "1.8.0"
composeRules = "0.6.8"
room = "2.8.5"
hilt = "2.60.1"

# --- Android SDK ---
compileSdk = "37" # Compose 1.12 / Hilt 1.4 AARs require API 37 at compile time.
targetSdk = "36" # Xiaomi Pad 8 runs Android 16; bump deliberately when HyperOS 4 lands.
minSdk = "29"

# --- AndroidX ---
androidxActivity = "1.13.0"
androidxCore = "1.19.1"
androidxFragment = "1.9.1"
androidxLifecycle = "2.11.0"
androidxComposeBom = "2026.09.00"
# Material 3 Expressive (MaterialExpressiveTheme, MotionScheme, LoadingIndicator, ButtonGroup) is
# still internal in the 1.4.0 stable that the BOM pins, so material3 is overridden ahead of the BOM.
# material3-adaptive-navigation-suite ships in lockstep and must move with it.
androidxMaterial3 = "1.5.0-alpha26"
androidxNavigation3 = "1.1.6"
androidxHilt = "1.4.0"
androidxDataStore = "1.3.0"
androidxWork = "2.12.0"
androidxDocumentFile = "1.1.0"
androidxTestExt = "1.3.0"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxUiautomator = "2.4.0"

# --- Kotlin ecosystem ---
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"
ktor = "3.6.1"
coil = "3.6.2"
jsoup = "1.23.2"
timber = "5.0.1"
javaxInject = "1"

# --- Domain libraries ---
readium = "3.4.0"
pdfboxAndroid = "2.0.27.0"
epubcheck = "5.4.0"

# --- Testing ---
junit4 = "4.13.2"
mockk = "1.14.11"
turbine = "1.2.1"
robolectric = "4.17"
konsist = "0.18.1"
# Screenshot tests run on Robolectric, so they need no device and go in the normal test task.
roborazzi = "1.74.0"
# Macrobenchmarks and the baseline profile they generate; the plugin moves with the library.
androidxBenchmark = "1.6.0-alpha01" # 1.4.x still uses AGP's removed TestedExtension and cannot apply.
androidxProfileinstaller = "1.4.1"
# Android stubs org.json, so JVM tests that touch Readium locators need the real implementation.
json = "20260814"

[libraries]
# Gradle plugins consumed by build-logic (compileOnly)
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
androidx-benchmark-gradlePlugin = { group = "androidx.benchmark", name = "benchmark-gradle-plugin", version.ref = "androidxBenchmark" }

# AndroidX core
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
androidx-fragment-compose = { group = "androidx.fragment", name = "fragment-compose", version.ref = "androidxFragment" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "androidxFragment" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "androidxDocumentFile" }
androidx-lifecycle-runtimeCompose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewModelCompose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewModelNavigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }

# Compose (versions come from the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidxMaterial3" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
androidx-compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout" }
androidx-compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation" }
androidx-compose-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3" }
androidx-compose-material3-adaptive-navigationSuite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite", version.ref = "androidxMaterial3" }
androidx-compose-material-iconsExtended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# Navigation 3
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "androidxNavigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "androidxNavigation3" }

# Data
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "androidxDataStore" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "androidxWork" }

# DI
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-core = { group = "com.google.dagger", name = "hilt-core", version.ref = "hilt" }
